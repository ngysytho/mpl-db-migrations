databaseChangeLog:
  - changeSet:
      id: user-provisioning-sync-journal-004
      author: mpl-team
      comment: Durable request reservation and transactional identity synchronization outbox
      changes:
        - sql:
            sql: |
              CREATE TABLE user_provisioning_requests (
                id UUID PRIMARY KEY,
                request_hash VARCHAR(64) NOT NULL,
                email VARCHAR(254) NOT NULL UNIQUE,
                user_id UUID UNIQUE REFERENCES users(id),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT now(),
                completed_at TIMESTAMP WITH TIME ZONE,
                CONSTRAINT ck_provisioning_completion CHECK ((user_id IS NULL) = (completed_at IS NULL)),
                CONSTRAINT ck_provisioning_email CHECK (email = lower(btrim(email)))
              );
              CREATE TABLE user_identity_sync (
                user_id UUID PRIMARY KEY REFERENCES users(id),
                attempts INTEGER NOT NULL DEFAULT 0 CHECK (attempts >= 0),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT now(),
                available_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT now()
              );
              CREATE INDEX ix_identity_sync_available ON user_identity_sync(available_at);
      rollback:
        - sql:
            sql: |
              DROP TABLE user_identity_sync;
              DROP TABLE user_provisioning_requests;
